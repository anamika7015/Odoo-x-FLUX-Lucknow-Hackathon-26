<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#4F46E5" /><title>Brightloop Software</title><script>(() => { const preference = localStorage.getItem('brightloop-theme') || 'system'; const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.classList.toggle('dark', dark); document.documentElement.dataset.theme = preference; })();</script></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
